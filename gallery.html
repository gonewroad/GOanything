<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>갤러리 — 타코야끼 동아리</title>
    <meta
      name="description"
      content="정기 세션, 외벽 등반, 대회와 MT까지. 동아리 활동 사진을 모았습니다."
    />
    <meta name="theme-color" content="#0a0b0d" />
    <link rel="stylesheet" href="assets/css/base.css" />
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>

  <body>
    <a class="skip-link" href="#all-photos">본문으로 건너뛰기</a>

    <header class="header is-stuck">
      <div class="container header__inner">
        <a class="logo" href="index.html">
          <span class="logo__mark" aria-hidden="true"></span>
          <span data-club="name">타코야끼 동아리</span>
          <span class="logo__sub" data-club="university">연합동아리</span>
        </a>

        <nav class="nav" id="site-nav" aria-label="주요 메뉴">
          <a class="nav__link" href="index.html#about">소개</a>
          <a class="nav__link" href="index.html#activities">활동</a>
          <a class="nav__link" href="index.html#beginner">처음이신가요?</a>
          <a class="nav__link" href="index.html#schedule">일정</a>
          <a class="nav__link is-active" href="gallery.html">갤러리</a>
          <a class="nav__link" href="index.html#faq">FAQ</a>
          <a class="nav__link nav__cta" href="join.html">가입하기</a>
        </nav>

        <a class="btn btn--primary header__cta" href="join.html">가입하기</a>

        <button
          class="nav-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
          aria-label="메뉴 열기"
        >
          <span class="nav-toggle__bar"></span>
        </button>
      </div>
    </header>

    <main>
      <section class="page-head">
        <div class="container">
          <span class="eyebrow">Gallery</span>
          <h1 class="page-head__title">벽 앞에서의 기록</h1>
          <p class="page-head__desc">
            정기 세션부터 외벽 등반, 대회와 MT까지. 사진을 누르면 크게 볼 수 있고
            좌우 화살표로 넘길 수 있습니다.
          </p>
        </div>
      </section>

      <section class="section" id="all-photos" style="padding-top: 0">
        <div class="container">
          <div class="gallery gallery--page" data-gallery>
            <p class="state">사진을 불러오는 중…</p>
          </div>

          <p class="gallery__more">
            <a class="btn btn--ghost" href="index.html">← 홈으로 돌아가기</a>
          </p>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer__bottom" style="margin-top: 0; border-top: 0">
          <span>
            © <span data-year>2026</span>
            <span data-club="name">타코야끼 동아리</span>,
            <span data-club="university">연합동아리</span>
          </span>
          <span>
            사진은 <code>data/gallery.json</code> 에서 관리합니다
          </span>
        </div>
      </div>
    </footer>

    <script src="assets/js/main.js" defer></script>
    <script src="assets/js/gallery.js" defer></script>
  </body>
</html>
